<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0f">
  <meta name="robots" content="noindex, nofollow">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>N4cuply</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap">
  <link rel="stylesheet" href="style.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script type="module" src="app.js"></script>
</head>
<body class="booting">
  <!-- Splash: retro Walkman while the app starts -->
  <div id="splash" class="splash" aria-hidden="true">
    <svg class="walkman" viewBox="0 0 320 210" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="wm-body" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#e6e9ef"/><stop offset=".55" stop-color="#b9bfca"/><stop offset="1" stop-color="#8e95a3"/>
        </linearGradient>
        <linearGradient id="wm-band" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#2b58c9"/><stop offset="1" stop-color="#4d8dff"/>
        </linearGradient>
        <linearGradient id="wm-glass" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#1a2233"/><stop offset="1" stop-color="#0b0f18"/>
        </linearGradient>
        <radialGradient id="wm-tape">
          <stop offset=".45" stop-color="#3a2618"/><stop offset="1" stop-color="#5a3a22"/>
        </radialGradient>
      </defs>
      <!-- play keys on top -->
      <g class="wm-keys">
        <rect x="70" y="10" width="34" height="16" rx="3" fill="#9aa1ae"/>
        <rect x="110" y="10" width="34" height="16" rx="3" fill="#9aa1ae"/>
        <rect class="wm-play" x="150" y="14" width="40" height="12" rx="3" fill="#ff8a3d"/>
        <rect x="196" y="10" width="34" height="16" rx="3" fill="#9aa1ae"/>
      </g>
      <!-- body -->
      <rect x="20" y="22" width="280" height="176" rx="18" fill="url(#wm-body)"/>
      <rect x="20" y="22" width="280" height="30" rx="18" fill="url(#wm-band)"/>
      <rect x="20" y="40" width="280" height="12" fill="url(#wm-band)"/>
      <text x="36" y="42" fill="#fff" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="800" font-style="italic" letter-spacing="1">N4cuply</text>
      <circle class="wm-led" cx="282" cy="37" r="4" fill="#22d3ee"/>
      <!-- cassette window -->
      <rect x="40" y="66" width="240" height="112" rx="12" fill="url(#wm-glass)"/>
      <rect x="54" y="76" width="212" height="92" rx="8" fill="#11151f" stroke="#2b3345"/>
      <rect x="70" y="84" width="180" height="22" rx="4" fill="#e9edf5"/>
      <text x="160" y="99" text-anchor="middle" fill="#2b58c9" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="10" font-weight="800" letter-spacing="2">SIDE A · LOSSLESS</text>
      <!-- tape between reels -->
      <path class="wm-tapeline" d="M104 150 L216 150" stroke="#4a3020" stroke-width="3" stroke-dasharray="6 5"/>
      <!-- left reel (full) and right reel (empty) -->
      <g class="wm-reel wm-reel-l">
        <circle cx="110" cy="134" r="24" fill="url(#wm-tape)"/>
        <circle cx="110" cy="134" r="11" fill="#e9edf5"/>
        <g stroke="#11151f" stroke-width="2.4" stroke-linecap="round">
          <path d="M110 125v5M110 138v5M101 134h5M114 134h5"/>
        </g>
      </g>
      <g class="wm-reel wm-reel-r">
        <circle cx="210" cy="134" r="15" fill="url(#wm-tape)"/>
        <circle cx="210" cy="134" r="11" fill="#e9edf5"/>
        <g stroke="#11151f" stroke-width="2.4" stroke-linecap="round">
          <path d="M210 125v5M210 138v5M201 134h5M214 134h5"/>
        </g>
      </g>
      <!-- glass shine -->
      <path d="M44 70 L130 70 L96 176 L44 176 Z" fill="#fff" opacity=".05"/>
      <!-- headphone jack + cable -->
      <rect x="292" y="120" width="10" height="16" rx="3" fill="#7d8492"/>
      <path class="wm-cable" d="M302 128 C 330 128, 330 200, 300 214" fill="none" stroke="#4d8dff" stroke-width="3" stroke-linecap="round"/>
    </svg>
    <div class="splash-text">
      <b>N4cuply</b>
      <span>Rewinding your library<span class="splash-dots"><i>.</i><i>.</i><i>.</i></span></span>
    </div>
  </div>

  <!-- Login -->
  <section id="login" class="login" hidden>
    <div class="login-glow" aria-hidden="true"></div>
    <div class="login-card">
      <img src="icons/icon.svg" alt="" class="login-logo" width="84" height="84">
      <h1>N4cuply</h1>
      <p class="login-tag">Your music, straight from your Drive.</p>

      <!-- Family members: username and password -->
      <form id="family-login" class="login-form" autocomplete="on">
        <input id="fl-user" class="set-input" type="text" name="username" placeholder="Username" autocomplete="username" autocapitalize="none" spellcheck="false" required>
        <input id="fl-pass" class="set-input" type="password" name="password" placeholder="Password" autocomplete="current-password" required>
        <button class="pill-btn light big" type="submit">Sign in</button>
        <button class="text-btn" type="button" data-login="show-signup">New here? Ask for an account</button>
      </form>

      <form id="family-signup" class="login-form" autocomplete="off" hidden>
        <input id="fs-name" class="set-input" type="text" placeholder="Your name" maxlength="60" required>
        <input id="fs-user" class="set-input" type="text" placeholder="Choose a username" autocomplete="username" autocapitalize="none" spellcheck="false" minlength="3" maxlength="32" pattern="[A-Za-z0-9._\-]{3,32}" required>
        <input id="fs-pass" class="set-input" type="password" placeholder="Choose a password (6+ characters)" autocomplete="new-password" minlength="6" required>
        <button class="pill-btn light big" type="submit">Ask for an account</button>
        <button class="text-btn" type="button" data-login="show-login">I already have an account</button>
      </form>

      <p id="login-error" class="login-error" role="alert" hidden></p>
      <p id="login-ok" class="login-note login-ok" role="status" hidden></p>

      <div class="login-admin">
        <button id="connect" class="text-btn" type="button">Admin? Sign in with Google</button>
      </div>
    </div>
  </section>

  <!-- App -->
  <div id="app" class="app" hidden>
    <aside id="sidebar" class="sidebar"></aside>
    <header class="topbar glass">
      <a href="#" class="brand" aria-label="Home"><img src="icons/icon.svg" alt="" width="30" height="30"></a>
      <label class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Songs, albums, artists" autocomplete="off" aria-label="Search">
      </label>
      <button id="upload-btn" class="round-btn" type="button" aria-label="Upload songs" title="Upload songs">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5M5 20h14"/></svg>
      </button>
      <button id="fs-btn" class="round-btn fs-btn" type="button" aria-label="Full screen" title="Full screen (F)" hidden></button>
      <button id="settings-btn" class="round-btn" type="button" aria-label="Settings" title="Settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg>
      </button>
    </header>

    <main id="main" class="main" tabindex="-1"></main>

    <div id="selbar" class="selbar glass" hidden></div>
    <nav id="tabbar" class="tabbar glass" aria-label="Main"></nav>

    <!-- Mini player -->
    <div id="mini" class="mini glass" hidden>
      <button id="mini-open" class="mini-info" type="button" aria-label="Open Now Playing">
        <span class="art mini-art" id="mini-art"></span>
        <span class="mini-text"><b id="mini-title"></b><small id="mini-artist"></small></span>
      </button>
      <button id="mini-play" class="icon-btn" type="button" aria-label="Play"></button>
      <button id="mini-next" class="icon-btn" type="button" aria-label="Next"></button>
      <div class="mini-bar"><span id="mini-progress"></span></div>
    </div>
  </div>

  <!-- Now playing -->
  <section id="now" class="now" hidden aria-label="Now playing">
    <div class="np-bg" aria-hidden="true"><div class="np-bg-img" id="np-bg-img"></div></div>
    <div class="np-layout">
      <div class="np-art-wrap">
        <div class="art np-art" id="np-art"></div>
        <div class="np-deck" id="np-deck"></div>
      </div>
      <div class="np-top">
        <button id="np-close" class="round-btn glass-soft" type="button" aria-label="Close"></button>
        <span class="np-handle" aria-hidden="true"></span>
        <span class="np-top-right"><button id="np-fs" class="round-btn glass-soft fs-btn" type="button" aria-label="Full screen" title="Full screen (F)" hidden></button>
        <button id="np-style" class="round-btn glass-soft" type="button" aria-label="Change player style" title="Player style"></button>
        <button id="np-more" class="round-btn glass-soft" type="button" aria-label="Song info"></button></span>
      </div>
      <div class="np-body">
        <div class="np-titlerow">
          <div class="np-titles">
            <h2 id="np-title"></h2>
            <button id="np-artist" class="np-artist" type="button"></button>
          </div>
          <button id="np-like" class="round-btn glass-soft" type="button" aria-label="Add to Liked songs"></button>
          <button id="np-info" class="round-btn glass-soft" type="button" aria-label="Info"></button>
        </div>
        <button id="np-lyric" class="np-lyric" type="button" hidden></button>
        <div class="np-progress">
          <input id="seek" type="range" min="0" max="1000" value="0" step="1" aria-label="Seek">
          <div class="np-times">
            <span id="t-cur">0:00</span>
            <span id="np-badge" class="np-badge"></span>
            <span id="t-left">-0:00</span>
          </div>
          <p class="np-tech" id="np-tech"></p>
        </div>
        <div class="np-controls">
          <button id="c-prev" class="ctrl" type="button" aria-label="Previous"></button>
          <button id="c-play" class="ctrl play" type="button" aria-label="Play"></button>
          <button id="c-next" class="ctrl" type="button" aria-label="Next"></button>
        </div>
        <div class="np-volume">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path class="fill" d="M4 9h4l5-4v14l-5-4H4z"/></svg>
          <input id="volume" type="range" min="0" max="100" value="100" aria-label="Volume">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path class="fill" d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 8.5a5 5 0 010 7M18.5 6a8.5 8.5 0 010 12"/></svg>
        </div>
        <div class="np-bottom">
          <button id="c-lyrics" class="icon-btn" type="button" aria-label="Lyrics"></button>
          <button id="c-shuffle" class="icon-btn toggle" type="button" aria-label="Shuffle"></button>
          <button id="c-repeat" class="icon-btn toggle" type="button" aria-label="Repeat"></button>
          <button id="c-queue" class="icon-btn" type="button" aria-label="Queue"></button>
          <button id="c-sleep" class="icon-btn toggle sleep-btn" type="button" aria-label="Sleep timer"></button>
        </div>
      </div>
    </div>
  </section>

  <!-- Bottom sheet: info / lyrics / queue / album info -->
  <div id="sheet-scrim" class="sheet-scrim" hidden></div>
  <section id="sheet" class="sheet glass" hidden role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <div class="sheet-head">
      <span class="np-handle" aria-hidden="true"></span>
      <h3 id="sheet-title"></h3>
      <button id="sheet-close" class="round-btn glass-soft" type="button" aria-label="Close"></button>
    </div>
    <div id="sheet-body" class="sheet-body"></div>
  </section>

  <input id="file-input" type="file" accept="audio/*,.flac,.m4a,.alac,.opus,.ogg,.wav,.lrc,image/*" multiple hidden>
  <input id="cover-input" type="file" accept="image/jpeg,image/png" hidden>
  <input id="avatar-input" type="file" accept="image/*" hidden>
  <div id="drop" class="drop" hidden><div><b>Drop to upload</b><span>Songs, .lrc lyrics and cover images</span></div></div>

  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
