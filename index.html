<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0f">
  <meta name="robots" content="noindex, nofollow">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>N4cuply</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap">
  <link rel="stylesheet" href="style.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script type="module" src="app.js"></script>
</head>
<body>
  <!-- Login -->
  <section id="login" class="login" hidden>
    <div class="login-glow" aria-hidden="true"></div>
    <div class="login-card">
      <img src="icons/icon.svg" alt="" class="login-logo" width="84" height="84">
      <h1>N4cuply</h1>
      <p class="login-tag">Your music, straight from your Drive.</p>
      <p>Lossless, Hi-Res, and every detail in the file.</p>
      <button id="connect" class="pill-btn light big" type="button">Connect with Google</button>
      <p class="login-note">Read-only access. Nothing in your Drive is changed or deleted.</p>
      <p id="login-error" class="login-error" role="alert" hidden></p>
    </div>
  </section>

  <!-- App -->
  <div id="app" class="app" hidden>
    <header class="topbar glass">
      <a href="#" class="brand" aria-label="Home"><img src="icons/icon.svg" alt="" width="30" height="30"></a>
      <label class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Songs, albums, artists" autocomplete="off" aria-label="Search">
      </label>
      <button id="upload-btn" class="round-btn" type="button" aria-label="Upload songs" title="Upload songs">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5M5 20h14"/></svg>
      </button>
      <button id="settings-btn" class="round-btn" type="button" aria-label="Settings" title="Settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg>
      </button>
    </header>

    <main id="main" class="main" tabindex="-1"></main>

    <!-- Mini player -->
    <div id="mini" class="mini glass" hidden>
      <button id="mini-open" class="mini-info" type="button" aria-label="Open Now Playing">
        <span class="art mini-art" id="mini-art"></span>
        <span class="mini-text"><b id="mini-title"></b><small id="mini-artist"></small></span>
      </button>
      <button id="mini-play" class="icon-btn" type="button" aria-label="Play"></button>
      <button id="mini-next" class="icon-btn" type="button" aria-label="Next"></button>
      <div class="mini-bar"><span id="mini-progress"></span></div>
    </div>
  </div>

  <!-- Now playing -->
  <section id="now" class="now" hidden aria-label="Now playing">
    <div class="np-bg" aria-hidden="true"><div class="np-bg-img" id="np-bg-img"></div></div>
    <div class="np-layout">
      <div class="np-art-wrap">
        <div class="art np-art" id="np-art"></div>
      </div>
      <div class="np-top">
        <button id="np-close" class="round-btn glass-soft" type="button" aria-label="Close"></button>
        <span class="np-handle" aria-hidden="true"></span>
        <button id="np-more" class="round-btn glass-soft" type="button" aria-label="Song info"></button>
      </div>
      <div class="np-body">
        <p class="np-tech" id="np-tech"></p>
        <div class="np-titlerow">
          <div class="np-titles">
            <h2 id="np-title"></h2>
            <button id="np-artist" class="np-artist" type="button"></button>
          </div>
          <button id="np-info" class="round-btn glass-soft" type="button" aria-label="Info"></button>
        </div>
        <button id="np-lyric" class="np-lyric" type="button" hidden></button>
        <div class="np-progress">
          <input id="seek" type="range" min="0" max="1000" value="0" step="1" aria-label="Seek">
          <div class="np-times">
            <span id="t-cur">0:00</span>
            <span id="np-badge" class="np-badge"></span>
            <span id="t-left">-0:00</span>
          </div>
        </div>
        <div class="np-controls">
          <button id="c-prev" class="ctrl" type="button" aria-label="Previous"></button>
          <button id="c-play" class="ctrl play" type="button" aria-label="Play"></button>
          <button id="c-next" class="ctrl" type="button" aria-label="Next"></button>
        </div>
        <div class="np-volume">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path class="fill" d="M4 9h4l5-4v14l-5-4H4z"/></svg>
          <input id="volume" type="range" min="0" max="100" value="100" aria-label="Volume">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path class="fill" d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 8.5a5 5 0 010 7M18.5 6a8.5 8.5 0 010 12"/></svg>
        </div>
        <div class="np-bottom">
          <button id="c-lyrics" class="icon-btn" type="button" aria-label="Lyrics"></button>
          <button id="c-shuffle" class="icon-btn toggle" type="button" aria-label="Shuffle"></button>
          <button id="c-repeat" class="icon-btn toggle" type="button" aria-label="Repeat"></button>
          <button id="c-queue" class="icon-btn" type="button" aria-label="Queue"></button>
        </div>
      </div>
    </div>
  </section>

  <!-- Bottom sheet: info / lyrics / queue / album info -->
  <div id="sheet-scrim" class="sheet-scrim" hidden></div>
  <section id="sheet" class="sheet glass" hidden role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <div class="sheet-head">
      <span class="np-handle" aria-hidden="true"></span>
      <h3 id="sheet-title"></h3>
      <button id="sheet-close" class="round-btn glass-soft" type="button" aria-label="Close"></button>
    </div>
    <div id="sheet-body" class="sheet-body"></div>
  </section>

  <input id="file-input" type="file" accept="audio/*,.flac,.m4a,.alac,.opus,.ogg,.wav,.lrc,image/*" multiple hidden>
  <input id="cover-input" type="file" accept="image/jpeg,image/png" hidden>
  <div id="drop" class="drop" hidden><div><b>Drop to upload</b><span>Songs, .lrc lyrics and cover images</span></div></div>

  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
