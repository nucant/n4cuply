<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- N4cuply: 80s synthwave sunset, neon grid and a cassette -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f0426"/>
      <stop offset=".62" stop-color="#3a0d5c"/>
      <stop offset="1" stop-color="#14052c"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe86b"/>
      <stop offset=".42" stop-color="#ff9d3c"/>
      <stop offset=".75" stop-color="#ff3d8b"/>
      <stop offset="1" stop-color="#c41a8f"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b0a4d"/>
      <stop offset="1" stop-color="#0c0320"/>
    </linearGradient>
    <linearGradient id="label" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff3d8b"/>
      <stop offset="1" stop-color="#ff9d3c"/>
    </linearGradient>
    <mask id="cuts">
      <rect width="512" height="512" fill="#fff"/>
      <rect x="0" y="214" width="512" height="7" fill="#000"/>
      <rect x="0" y="240" width="512" height="9" fill="#000"/>
      <rect x="0" y="268" width="512" height="11" fill="#000"/>
      <rect x="0" y="298" width="512" height="13" fill="#000"/>
    </mask>
    <clipPath id="tile"><rect width="512" height="512" rx="112"/></clipPath>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="url(#sky)"/>
    <!-- stars -->
    <g fill="#fff">
      <circle cx="78" cy="86" r="3" opacity=".8"/>
      <circle cx="132" cy="150" r="2" opacity=".55"/>
      <circle cx="402" cy="72" r="3" opacity=".75"/>
      <circle cx="446" cy="160" r="2" opacity=".5"/>
      <circle cx="330" cy="40" r="2" opacity=".5"/>
      <circle cx="58" cy="230" r="2" opacity=".4"/>
    </g>
    <!-- sunset -->
    <circle cx="256" cy="232" r="148" fill="url(#sun)" mask="url(#cuts)"/>
    <!-- grid floor -->
    <rect x="0" y="330" width="512" height="182" fill="url(#floor)"/>
    <g stroke="#ff3dac" stroke-width="3" fill="none" opacity=".85">
      <path d="M0 352H512M0 381H512M0 420H512M0 474H512"/>
      <path d="M256 330V512M206 330L106 512M306 330L406 512M156 330L-44 512M356 330L556 512M106 330L-194 512M406 330L706 512"/>
    </g>
    <path d="M0 330H512" stroke="#ff7ad9" stroke-width="5" filter="url(#glow)"/>

    <!-- cassette -->
    <g filter="url(#glow)">
      <rect x="146" y="262" width="220" height="142" rx="20" fill="#170630" stroke="#3ef4ff" stroke-width="9"/>
      <rect x="170" y="282" width="172" height="34" rx="8" fill="url(#label)"/>
      <rect x="190" y="328" width="132" height="48" rx="24" fill="#0b021b" stroke="#3ef4ff" stroke-width="5"/>
      <circle cx="222" cy="352" r="15" fill="#ffe86b"/>
      <circle cx="290" cy="352" r="15" fill="#ffe86b"/>
      <circle cx="222" cy="352" r="5" fill="#170630"/>
      <circle cx="290" cy="352" r="5" fill="#170630"/>
      <path d="M196 404L210 384H302L316 404" fill="none" stroke="#3ef4ff" stroke-width="5" stroke-linejoin="round"/>
    </g>
    <!-- "N4" on the label -->
    <text x="256" y="309" text-anchor="middle" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="26" font-weight="900" font-style="italic" letter-spacing="3" fill="#170630">N4CUPLY</text>
  </g>
</svg>
